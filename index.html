function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

        e("button",{onClick:function(){startLevel(selectedLevel.id);},style:{width:"100%",padding:"16px",borderRadius:14,fontSize:17,fontWeight:700,background:"linear-gradient(135deg,#fbbf24,#f59e0b)",border:"none",color:"#1a0e2e",boxShadow:"0 4px 20px rgba(251,191,36,0.3)",marginBottom:10}},"TRY AGAIN \u2694\uFE0F"),
        e("button",{onClick:function(){setScreen("levelSelect");},style:{width:"100%",padding:"12px",borderRadius:12,fontSize:14,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",color:"#94a3b8"}},"Level Select"))
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(SpellKnight));
</script>
