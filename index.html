<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spell Knight - Silent Letters Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#0f172a;overflow-x:hidden;}
button{font-family:'Outfit',sans-serif;cursor:pointer;}
button:hover{opacity:0.92;}
button:active{transform:scale(0.97);}
@keyframes twk{0%{opacity:0.1}100%{opacity:0.6}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pfly{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(0.3);opacity:0}}
@keyframes midle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes mshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes mhit{0%{transform:scale(1)}30%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes sanim{0%{opacity:0;transform:scale(0.5)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px rgba(251,191,36,0.3)}50%{text-shadow:0 0 25px rgba(251,191,36,0.7)}}
@keyframes lpop{0%{transform:scale(0);opacity:0}15%{transform:scale(1.3);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef} = React;

const LEVELS=[
  {id:1,name:"The Whispering Woods",rank:"Apprentice",desc:"Common words with silent letters hiding in plain sight.",color:"#4ade80",
    boss:{name:"Moss Troll",emoji:"\u{1F9CC}",hp:3,xp:40},
    minions:[{name:"Twig Sprite",emoji:"\u{1F33F}",hp:1,xp:10},{name:"Bark Imp",emoji:"\u{1F342}",hp:1,xp:12}],
    words:[
      {word:"two",silent:"w",position:1,related:"twelve",hint:"Say 'twelve' slowly. Hear the W? It vanishes in 'two.'"},
      {word:"moisten",silent:"t",position:4,related:"moist",hint:"The base word 'moist' has a clear T. Where did it go?"},
      {word:"damn",silent:"n",position:3,related:"damnation",hint:"Add '-ation' and that final letter comes roaring back."},
      {word:"nestle",silent:"t",position:3,related:"nest",hint:"To nestle is to settle into a nest. The T hides when you add '-le.'"},
      {word:"cupboard",silent:"p",position:2,related:"cup",hint:"A cupboard held cups. Say 'cup' and hear the lost letter."},
    ]},
  {id:2,name:"The Forgotten Library",rank:"Squire",desc:"Words from history and ceremony with deeper silent letters.",color:"#a78bfa",
    boss:{name:"Ink Wraith",emoji:"\u{1F47B}",hp:4,xp:50},
    minions:[{name:"Dust Mote",emoji:"\u2728",hp:1,xp:14},{name:"Page Phantom",emoji:"\u{1F4DC}",hp:2,xp:18}],
    words:[
      {word:"christen",silent:"t",position:5,related:"Christ",hint:"The ceremony comes from 'Christ.' Say it and hear the hidden letter."},
      {word:"reign",silent:"g",position:3,related:"regal",hint:"A king reigns from a regal throne. One word keeps the G; the other drops it."},
      {word:"chasten",silent:"t",position:4,related:"chaste",hint:"To chasten someone is to make them pure, or chaste. Hear the difference?"},
      {word:"handsome",silent:"d",position:3,related:"hand",hint:"Originally meant 'easy to hand-le.' Say 'hand' and hear what is lost."},
      {word:"indict",silent:"c",position:4,related:"dictate",hint:"Both come from the Latin word for 'say.' In 'dictate' you hear every letter."},
      {word:"corps",silent:"p",position:3,related:"corporal",hint:"A corps is a body of soldiers. A corporal leads them, and pronounces every letter."},
    ]},
  {id:3,name:"The Shadow Cathedral",rank:"Knight",desc:"Trickier words where silent letters lurk in unexpected places.",color:"#38bdf8",
    boss:{name:"Gargoyle Scribe",emoji:"\u{1F5FF}",hp:5,xp:60},
    minions:[{name:"Stone Bat",emoji:"\u{1F987}",hp:2,xp:18},{name:"Echo Shade",emoji:"\u{1F464}",hp:2,xp:22}],
    words:[
      {word:"apostle",silent:"t",position:4,related:"apostolic",hint:"The adjective form 'apostolic' brings the T back to life."},
      {word:"benign",silent:"g",position:4,related:"benignity",hint:"A benign tumor is harmless. 'Benignity' reveals the hidden G."},
      {word:"deign",silent:"g",position:3,related:"dignity",hint:"To deign means to lower your dignity. The G is only heard in one."},
      {word:"balm",silent:"l",position:2,related:"balsam",hint:"Balm comes from balsam, a soothing plant resin. The L hides in the shorter word."},
      {word:"wrestle",silent:"t",position:4,related:"wrest",hint:"To wrestle is to wrest something away. The T disappears when you add '-le.'"},
    ]},
  {id:4,name:"The Arcane Vault",rank:"Champion",desc:"Advanced vocabulary with silent letters from Latin and Greek roots.",color:"#f472b6",
    boss:{name:"Cipher Golem",emoji:"\u{1F916}",hp:6,xp:70},
    minions:[{name:"Rune Wisp",emoji:"\u{1F52E}",hp:2,xp:24},{name:"Glyph Specter",emoji:"\u{1F441}\uFE0F",hp:3,xp:28}],
    words:[
      {word:"phlegm",silent:"g",position:4,related:"phlegmatic",hint:"A calm person is phlegmatic. Say it and the G reappears."},
      {word:"mortgage",silent:"t",position:3,related:"mortal",hint:"Mortgage literally meant 'death pledge.' 'Mortal' keeps the T alive."},
      {word:"iamb",silent:"b",position:3,related:"iambic",hint:"Shakespeare wrote in iambic pentameter. The B hides in the shorter form."},
      {word:"consign",silent:"g",position:5,related:"signatory",hint:"To consign means to sign something over. A signatory pronounces every letter."},
      {word:"corpuscle",silent:"c",position:6,related:"corpuscular",hint:"A corpuscle is a tiny body (cell). 'Corpuscular' reveals the hidden C."},
    ]},
  {id:5,name:"The Silent King's Throne",rank:"Archmage",desc:"The hardest words in the realm. Only true Spell Knights survive.",color:"#fbbf24",
    boss:{name:"The Silent King",emoji:"\u{1F451}",hp:7,xp:100,isBoss:true},
    minions:[{name:"Void Knight",emoji:"\u2694\uFE0F",hp:3,xp:30},{name:"Phantom Scribe",emoji:"\u{1F58B}\uFE0F",hp:3,xp:32}],
    words:[
      {word:"paradigm",silent:"g",position:6,related:"paradigmatic",hint:"A paradigm is a model. 'Paradigmatic' is its adjective, and the G returns."},
      {word:"diaphragm",silent:"g",position:7,related:"diaphragmatic",hint:"The muscle that helps you breathe. Add '-atic' and hear every letter."},
      {word:"impugn",silent:"g",position:4,related:"pugnacious",hint:"To impugn is to attack with words. A pugnacious person loves to fight."},
      {word:"epistle",silent:"t",position:4,related:"epistolary",hint:"An epistle is a letter. An epistolary novel is told through letters. Hear the T?"},
      {word:"ensign",silent:"g",position:4,related:"signify",hint:"An ensign is a sign of rank. 'Signify' pronounces the G loud and clear."},
    ]},
];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getBlank(e){const c=e.word.split("");c[e.position]="?";return c;}
function genChoices(correct){const c="bcdfghjklmnpqrstvwxyz".split("").filter(x=>x!==correct);const p=shuffle(c).slice(0,3);p.push(correct);return shuffle(p);}

const SFX={_r:false,
  async init(){if(this._r)return;try{if(typeof Tone!=="undefined"){await Tone.start();this._r=true;}}catch(e){}},
  _s(note,type,dur,vol,delay){if(!this._r||typeof Tone==="undefined")return;type=type||"square";dur=dur||"8n";vol=vol||-12;delay=delay||0;setTimeout(function(){try{var s=new Tone.Synth({oscillator:{type:type},envelope:{attack:0.01,decay:0.15,sustain:0,release:0.1},volume:vol}).toDestination();s.triggerAttackRelease(note,dur);}catch(e){}},delay);},
  attack(){this._s("C5");this._s("E5","square","8n",-12,80);},
  combo(){var n=["C5","E5","G5","C6"];for(var i=0;i<n.length;i++)this._s(n[i],"triangle","16n",-10,i*60);},
  wrong(){this._s("C3","sawtooth","8n",-14);},
  victory(){var n=["C5","E5","G5","C6","E6"];for(var i=0;i<n.length;i++)this._s(n[i],"triangle","8n",-8,i*120);},
  defeat(){var n=["E4","D4","C4","B3"];for(var i=0;i<n.length;i++)this._s(n[i],"sawtooth","4n",-14,i*200);},
  levelUp(){var n=["G4","B4","D5","G5"];for(var i=0;i<n.length;i++)this._s(n[i],"square","8n",-12,i*100);},
  boss(){var n=["C3","C3","G3","C3"];for(var i=0;i<n.length;i++)this._s(n[i],"sawtooth","8n",-10,i*200);},
};

function Particles({particles}){return(
  React.createElement("div",{style:{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden"}},
    particles.map(function(p){return React.createElement("div",{key:p.id,style:{position:"absolute",left:p.x,top:p.y,fontSize:p.size||16,color:p.color||"#fbbf24",fontWeight:800,fontFamily:"'Space Mono',monospace",animation:"pfly "+(p.dur||1)+"s ease-out forwards",opacity:0.9,textShadow:"0 0 10px "+(p.color||"#fbbf24")}},p.text)})
  )
);}

function HPBar({current,max,color,label,height}){
  height=height||14;
  var pct=Math.max(0,(current/max)*100);
  return React.createElement("div",null,
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:3,fontSize:11,fontFamily:"'Space Mono',monospace"}},
      React.createElement("span",{style:{color:"#94a3b8"}},label),
      React.createElement("span",{style:{color:color}},current+"/"+max)
    ),
    React.createElement("div",{style:{height:height,background:"rgba(0,0,0,0.4)",borderRadius:height/2,overflow:"hidden",border:"1px solid rgba(255,255,255,0.08)"}},
      React.createElement("div",{style:{height:"100%",width:pct+"%",borderRadius:height/2,background:"linear-gradient(90deg,"+color+","+color+"88)",transition:"width 0.4s ease",boxShadow:"0 0 10px "+color+"44"}})
    )
  );
}

function MonsterSprite({monster,shake,hit}){
  return React.createElement("div",{style:{fontSize:monster.isBoss?96:72,textAlign:"center",lineHeight:1,animation:shake?"mshake 0.3s ease":hit?"mhit 0.4s ease":"midle 2s ease-in-out infinite",filter:hit?"brightness(3)":"none",transition:"filter 0.1s"}},monster.emoji);
}

function SlashEffect({show}){
  if(!show)return null;
  return React.createElement("div",{style:{position:"absolute",inset:0,pointerEvents:"none",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10}},
    React.createElement("svg",{width:"200",height:"200",viewBox:"0 0 200 200",style:{animation:"sanim 0.4s ease-out forwards"}},
      React.createElement("line",{x1:"20",y1:"180",x2:"180",y2:"20",stroke:"#fbbf24",strokeWidth:"4",strokeLinecap:"round",style:{filter:"drop-shadow(0 0 8px #fbbf24)"}},
        React.createElement("animate",{attributeName:"stroke-dasharray",from:"0 300",to:"300 0",dur:"0.3s",fill:"freeze"})
      )
    )
  );
}

function SpellKnight(){
  var [screen,setScreen]=useState("title");
  var [soundOn,setSoundOn]=useState(true);
  var [unlockedLevels,setUnlockedLevels]=useState([1]);
  var [selectedLevel,setSelectedLevel]=useState(null);
  var [playerHP,setPlayerHP]=useState(5);
  var [maxHP,setMaxHP]=useState(5);
  var [xp,setXP]=useState(0);
  var [level,setLevel]=useState(1);
  var [xpToNext,setXpToNext]=useState(30);
  var [totalStars,setTotalStars]=useState({});
  var [wordQueue,setWordQueue]=useState([]);
  var [wordIndex,setWordIndex]=useState(0);
  var [currentMonster,setCurrentMonster]=useState(null);
  var [monsterHP,setMonsterHP]=useState(1);
  var [monsterMaxHP,setMonsterMaxHP]=useState(1);
  var [choices,setChoices]=useState([]);
  var [selected,setSelected]=useState(null);
  var [showResult,setShowResult]=useState(false);
  var [streak,setStreak]=useState(0);
  var [bestStreak,setBestStreak]=useState(0);
  var [roundCorrect,setRoundCorrect]=useState(0);
  var [roundTotal,setRoundTotal]=useState(0);
  var [missed,setMissed]=useState([]);
  var [particles,setParticles]=useState([]);
  var [shakeMonster,setShakeMonster]=useState(false);
  var [hitMonster,setHitMonster]=useState(false);
  var [shakePlayer,setShakePlayer]=useState(false);
  var [showSlash,setShowSlash]=useState(false);
  var [showLevelUp,setShowLevelUp]=useState(false);
  var [screenFlash,setScreenFlash]=useState(null);
  var pidRef=useRef(0);

  function spawnP(texts,bx,by,color){
    var ps=texts.map(function(t){return{id:pidRef.current++,text:t,x:bx+(Math.random()-0.5)*80,y:by-Math.random()*30,color:color,size:typeof t==="string"&&t.length>2?14:20,dur:0.8+Math.random()*0.4};});
    setParticles(function(prev){return prev.concat(ps);});
    setTimeout(function(){setParticles(function(prev){return prev.filter(function(p){return ps.indexOf(p)===-1;});});},1500);
  }

  function pickMonster(lvlData,wi){
    if(wi>=lvlData.words.length-1)return Object.assign({},lvlData.boss);
    return Object.assign({},lvlData.minions[wi%lvlData.minions.length]);
  }

  function startLevel(lvlId){
    SFX.init();
    var lvlData=LEVELS.find(function(l){return l.id===lvlId;});
    setSelectedLevel(lvlData);
    var q=shuffle(lvlData.words);
    setWordQueue(q);setWordIndex(0);
    setStreak(0);setBestStreak(0);setRoundCorrect(0);setRoundTotal(0);setMissed([]);setParticles([]);
    setPlayerHP(maxHP);
    var m=pickMonster(lvlData,0);
    setCurrentMonster(m);setMonsterHP(m.hp);setMonsterMaxHP(m.hp);
    setChoices(genChoices(q[0].silent));
    setSelected(null);setShowResult(false);
    setScreen("battle");
    if(m.isBoss&&soundOn)setTimeout(function(){SFX.boss();},200);
  }

  function handleAnswer(letter){
    if(selected!==null)return;
    setSelected(letter);setShowResult(true);
    setRoundTotal(function(p){return p+1;});
    var currentWord=wordQueue[wordIndex];
    var correct=letter===currentWord.silent;
    var cx=Math.min(window.innerWidth,480)/2;

    if(correct){
      setRoundCorrect(function(p){return p+1;});
      var ns=streak+1;setStreak(ns);
      if(ns>bestStreak)setBestStreak(ns);
      if(soundOn)SFX.attack();
      setShowSlash(true);setTimeout(function(){setShowSlash(false);},500);
      setTimeout(function(){setHitMonster(true);setTimeout(function(){setHitMonster(false);},400);},200);
      setScreenFlash(selectedLevel.color);setTimeout(function(){setScreenFlash(null);},200);
      var dmg=ns>=5?3:ns>=3?2:1;
      var newMHP=Math.max(0,monsterHP-dmg);
      setMonsterHP(newMHP);
      spawnP(dmg>1?["-"+dmg+" HP","COMBO!"]:[ "-1 HP","\u2728"],cx,180,selectedLevel.color);
      if((ns===3||ns===5)&&soundOn)setTimeout(function(){SFX.combo();},300);
      var xpGain=10+(ns>=3?5:0);
      var newXP=xp+xpGain;
      spawnP(["+"+xpGain+" XP"],cx-100,350,"#fbbf24");
      if(newXP>=xpToNext){
        var nl=level+1;setLevel(nl);setXP(newXP-xpToNext);
        setXpToNext(Math.floor(xpToNext*1.4));
        var nm=maxHP+1;setMaxHP(nm);setPlayerHP(function(p){return Math.min(p+2,nm);});
        setShowLevelUp(true);if(soundOn)setTimeout(function(){SFX.levelUp();},400);
        setTimeout(function(){setShowLevelUp(false);},2000);
      }else{setXP(newXP);}
    }else{
      setStreak(0);if(soundOn)SFX.wrong();
      setShakePlayer(true);setTimeout(function(){setShakePlayer(false);},400);
      setScreenFlash("#f87171");setTimeout(function(){setScreenFlash(null);},200);
      setPlayerHP(function(prev){
        var nh=prev-1;
        if(nh<=0)setTimeout(function(){if(soundOn)SFX.defeat();setScreen("defeat");},1200);
        return nh;
      });
      setMissed(function(prev){return prev.concat([{word:currentWord.word,silent:currentWord.silent,related:currentWord.related,hint:currentWord.hint}]);});
      spawnP(["-1 \u2764\uFE0F"],cx+60,380,"#f87171");
    }
  }

  function handleNext(){
    var currentWord=wordQueue[wordIndex];
    var wasCorrect=selected===currentWord.silent;
    var monsterDead=wasCorrect&&monsterHP<=0;
    var nextIdx=wordIndex+1;
    if(nextIdx>=wordQueue.length){
      var pct=roundTotal>0?Math.round((roundCorrect/roundTotal)*100):0;
      var stars=playerHP===maxHP?3:pct>=80?2:1;
      setTotalStars(function(prev){var n=Object.assign({},prev);n[selectedLevel.id]=Math.max(stars,prev[selectedLevel.id]||0);return n;});
      if(selectedLevel.id<5)setUnlockedLevels(function(prev){return prev.indexOf(selectedLevel.id+1)===-1?prev.concat([selectedLevel.id+1]):prev;});
      if(soundOn)SFX.victory();setScreen("levelComplete");return;
    }
    setWordIndex(nextIdx);
    var nextWord=wordQueue[nextIdx];
    setChoices(genChoices(nextWord.silent));setSelected(null);setShowResult(false);
    if(monsterDead){
      var m=pickMonster(selectedLevel,nextIdx);
      setCurrentMonster(m);setMonsterHP(m.hp);setMonsterMaxHP(m.hp);
      if(m.isBoss&&soundOn)setTimeout(function(){SFX.boss();},200);
    }
  }

  /* ─── TITLE ─── */
  if(screen==="title"){
    return React.createElement("div",{style:{minHeight:"100vh",background:"linear-gradient(180deg,#0c0a1a 0%,#1a0e2e 40%,#0f172a 100%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 16px",position:"relative",overflow:"hidden"}},
      React.createElement("div",{style:{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none"}},
        Array.from({length:50}).map(function(_,i){return React.createElement("div",{key:i,style:{position:"absolute",left:(i*37%100)+"%",top:(i*53%100)+"%",width:(i%3)+1,height:(i%3)+1,background:"#fff",borderRadius:"50%",opacity:0.15+(i%5)*0.12,animation:"twk "+(2+i%3)+"s ease-in-out "+i*0.1+"s infinite alternate"}});})
      ),
      React.createElement("div",{style:{textAlign:"center",position:"relative",zIndex:1}},
        React.createElement("div",{style:{fontSize:80,marginBottom:8,filter:"drop-shadow(0 0 20px rgba(251,191,36,0.4))",animation:"fl 3s ease-in-out infinite"}},"\u2694\uFE0F"),
        React.createElement("div",{style:{fontSize:12,color:"#a78bfa",textTransform:"uppercase",letterSpacing:6,marginBottom:8,fontFamily:"'Space Mono',monospace"}},"Silent Letters Quest"),
        React.createElement("h1",{style:{fontSize:48,fontWeight:900,margin:"0 0 4px",lineHeight:1,background:"linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"SPELL KNIGHT"),
        React.createElement("p",{style:{fontSize:14,color:"#64748b",margin:"0 0 8px"}},"Volume II"),
        React.createElement("p",{style:{fontSize:15,color:"#94a3b8",maxWidth:380,margin:"0 auto 32px",lineHeight:1.6}},"Five realms. Twenty-six words. Every silent letter revealed by a related word that speaks the truth."),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:12,maxWidth:320,margin:"0 auto"}},
          React.createElement("button",{onClick:function(){setScreen("levelSelect");},style:{padding:"18px 32px",borderRadius:14,fontSize:18,fontWeight:700,background:"linear-gradient(135deg,#fbbf24,#f59e0b)",border:"none",color:"#1a0e2e",boxShadow:"0 4px 20px rgba(251,191,36,0.3),inset 0 1px 0 rgba(255,255,255,0.2)",letterSpacing:1}},"BEGIN QUEST"),
          React.createElement("button",{onClick:function(){setSoundOn(!soundOn);},style:{padding:"10px",borderRadius:10,fontSize:14,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#94a3b8"}},"Sound: "+(soundOn?"ON \u{1F50A}":"OFF \u{1F507}"))
        ),
        React.createElement("div",{style:{marginTop:40,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,maxWidth:360,margin:"40px auto 0"}},
          [{icon:"\u2764\uFE0F",label:"5 HP",desc:"Survive each realm"},{icon:"\u{1F525}",label:"Combos",desc:"Streaks hit harder"},{icon:"\u{1F4A1}",label:"Clues",desc:"Related word hints"}].map(function(item,i){
            return React.createElement("div",{key:i,style:{textAlign:"center",padding:12}},
              React.createElement("div",{style:{fontSize:28,marginBottom:4}},item.icon),
              React.createElement("div",{style:{fontSize:13,fontWeight:700,color:"#f8fafc"}},item.label),
              React.createElement("div",{style:{fontSize:11,color:"#64748b"}},item.desc)
            );
          })
        )
      )
    );
  }

  /* ─── LEVEL SELECT ─── */
  if(screen==="levelSelect"){
    return React.createElement("div",{style:{minHeight:"100vh",background:"linear-gradient(180deg,#0c0a1a 0%,#1a0e2e 40%,#0f172a 100%)",display:"flex",flexDirection:"column",alignItems:"center",padding:"32px 16px"}},
      React.createElement("div",{style:{width:"100%",maxWidth:480}},
        React.createElement("button",{onClick:function(){setScreen("title");},style:{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"#94a3b8",padding:"8px 16px",borderRadius:8,fontSize:14,marginBottom:24}},"Back"),
        React.createElement("div",{style:{textAlign:"center",marginBottom:8}},
          React.createElement("div",{style:{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:3,fontFamily:"'Space Mono',monospace"}},"Choose Your Realm")
        ),
        React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:8,marginBottom:24}},
          React.createElement("div",{style:{fontSize:12,color:"#a78bfa",fontFamily:"'Space Mono',monospace",background:"rgba(167,139,250,0.1)",padding:"4px 12px",borderRadius:20}},"Lv."+level),
